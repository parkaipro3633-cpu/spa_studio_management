d><tr><th>ID</th><th>会员</th><th>日期</th><th>入账会员币</th><th>实收金额</th><th>支付方式</th><th>确认人</th></tr></thead><tbody>${rechargeLog.map(x=>`<tr><td>#${x.id}</td><td>${memberName(x.member)}</td><td>${x.date}</td><td>+${x.amount} coins</td><td>${money(x.won)}</td><td>${x.method||'—'}</td><td>${x.approvedBy||'老板'}</td></tr>`).join('')}</tbody></table></div></section>`}
function openMemberDetail(id){const m=members.find(x=>x.id===id);if(!m)return;const r=rechargeLog.filter(x=>x.member===id),u=usageLog.filter(x=>x.member===id);const pending=rechargeRequests.filter(x=>x.member===id);openModal(`${m.name} · 会员资金流水`, `<div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr))">${stat('当前余额',m.balance+' coins')}${stat('累计充值',m.recharged+' coins')}${stat('累计使用',m.used+' coins')}</div><div class="field"><label>会员备注（个性化服务提示）</label><textarea id="memberNote" rows="3">${m.note||''}</textarea></div><h3>充值入账记录</h3><div class="tablewrap"><table><thead><tr><th>日期</th><th>金额</th><th>会员币</th><th>方式</th><th>确认人</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x.date}</td><td>${money(x.won)}</td><td>+${x.amount}</td><td>${x.method||'—'}</td><td>${x.approvedBy||'老板'}</td></tr>`).join('')||'<tr><td colspan="5">暂无充值记录</td></tr>'}</tbody></table></div><h3 style="margin-top:18px">服务消费记录</h3><div class="tablewrap"><table><thead><tr><th>日期</th><th>预约</th><th>服务</th><th>扣除会员币</th></tr></thead><tbody>${u.map(x=>{let b=bookings.find(z=>z.id===x.booking);return `<tr><td>${x.date}</td><td>#${x.booking}</td><td>${b?serviceName(serviceById(b.service)):x.description}</td><td>-${x.coins}</td></tr>`}).join('')||'<tr><td colspan="4">暂无消费记录</td></tr>'}</tbody></table></div><h3 style="margin-top:18px">充值申请状态</h3><div class="tablewrap"><table><thead><tr><th>日期</th><th>金额</th><th>方式</th><th>状态</th></tr></thead><tbody>${pending.map(x=>`<tr><td>${x.date}</td><td>${money(x.won)}</td><td>${paymentMethodName(x.method)}</td><td>${statusPill(x.status)}</td></tr>`).join('')||'<tr><td colspan="4">暂无充值申请</td></tr>'}</tbody></table></div>`,()=>{m.note=$('memberNote').value.trim();closeModal();render();toast('会员备注已保存')})}
function renderTherapists(){const ledger=bookings.filter(b=>b.status==='completed').slice().sort((a,b)=>b.date.localeCompare(a.date));return head(t('therapists'),t('staffList'),`<button onclick="openTherapistModal()">＋ ${t('addTherapist')}</button>`)+`<div class="service-grid">${therapists.map(th=>{const rows=ledger.filter(b=>b.tid===th.id);const unpaid=rows.filter(b=>b.commissionStatus!=='paid').reduce((a,b)=>a+commissionFor(b),0);return `<article class="service-card"><div class="person"><div class="avatar">${th.name[0]}</div><div><h3>${therapistName(th)}</h3><small class="muted">${th.active?t('active'):t('inactive')}</small></div></div><div class="muted small">${t('commissionRate')}: ${money(th.rate)}</div><div class="service-meta"><span class="pill blue">已完成服务 ${rows.length} 笔</span><span class="pill gold">待支付 ${money(unpaid)}</span></div><div><label>${t('serviceTag')}</label><div class="service-meta">${th.skills.map(id=>`<span class="pill">${serviceName(serviceById(id))}</span>`).join('')}</div></div><div class="actions"><button class="secondary" onclick="openTherapistModal(${th.id})">${t('edit')}</button><button class="secondary" onclick="toggleTherapist(${th.id})">${th.active?t('inactive'):t('active')}</button></div></article>`}).join('')}</div><section class="panel" style="margin-top:18px"><h2>技师服务流水与佣金</h2><div class="tablewrap"><table><thead><tr><th>服务日期</th><th>预约编号</th><th>技师</th><th>会员</th><th>服务项目</th><th>时长</th><th>佣金</th><th>支付状态</th><th>转账日期</th></tr></thead><tbody>${ledger.map(b=>`<tr><td>${b.date}</td><td>#${b.id}</td><td>${therapistName(therapistById(b.tid))}</td><td>${memberName(b.member)}</td><td>${serviceName(serviceById(b.service))}</td><td>${serviceById(b.service)?.duration||0} 分钟</td><td>${money(commissionFor(b))}</td><td>${b.commissionStatus==='paid'?'<span class="pill">已支付</span>':'<span class="pill gold">待支付</span>'}</td><td>${b.commissionPaidDate||'—'}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">暂无已完成服务流水</td></tr>'}</tbody></table></div><button class="secondary" onclick="go('finance')">进入财务报表进行佣金批量结算 →</button></section>`}
function renderSchedule(){let my=role==='therapist'?therapistSessionId:null;let list=shifts.filter(s=>!my||s.tid===my);return head(role==='therapist'?t('mySchedule'):'技师排班与请假管理',role==='owner'?'管理所有技师的排班、可预约时段和请假申请。':t('timeOpen')+' · '+t('requestLeave'),`<button onclick="openShiftModal()">＋ ${t('openTime')}</button>`)+`<div class="toolbar"><button class="secondary" onclick="openLeaveModal()">＋ ${t('requestLeave')}</button>${role==='owner'?`<select onchange="filterSchedule(this.value)"><option value="all">${t('all')}</option>${therapists.map(th=>`<option value="${th.id}">${therapistName(th)}</option>`).join('')}</select>`:`<button class="secondary" onclick="logoutTherapist()">退出登录</button>`}</div><section class="panel"><h2>${role==='owner'?'全部技师排班':t('mySchedule')}</h2><div class="tablewrap"><table><thead><tr><th>${t('therapist')}</th><th>${t('date')}</th><th>${t('startTime')}</th><th>${t('endTime')}</th><th>${t('status')}</th><th></th></tr></thead><tbody id="shiftRows">${list.map(s=>shiftRow(s)).join('')}</tbody></table></div></section><section class="panel" style="margin-top:16px"><h2>${t('requestLeave')}</h2><div class="tablewrap"><table><thead><tr><th>${t('therapist')}</th><th>${t('leaveDate')}</th><th>${t('startTime')}</th><th>${t('endTime')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>${leaveRequests.filter(l=>role!=='therapist'||l.tid===therapistSessionId).map(l=>`<tr><td>${therapistName(therapistById(l.tid))}</td><td>${l.date}</td><td>${l.start}</td><td>${l.end}</td><td>${statusPill(l.status)}</td><td>${role==='owner'&&l.status==='pending'?`<button onclick="decideLeave(${l.id,true})">${t('approve')}</button> <button class="secondary" onclick="decideLeave(${l.id,false})">${t('reject')}</button>`:''}</td></tr>`).join('')}</tbody></table></div></section>`}
function shiftRow(s){return `<tr><td>${therapistName(therapistById(s.tid))}</td><td>${s.date}</td><td>${s.start}</td><td>${s.end}</td><td>${s.status==='open'?statusPill('confirmed'):statusPill(s.status)}</td><td><button class="secondary" onclick="removeShift(${s.tid},'${s.date}')">${t('delete')}</button></td></tr>`}
function filterSchedule(v){let my=role==='therapist'?therapistSessionId:null;$('shiftRows').innerHTML=shifts.filter(s=>(!my||s.tid===my)&&(v==='all'||s.tid===+v)).map(shiftRow).join('')}
function renderRooms(){return head(t('rooms'),t('roomAssign'),`<button onclick="openRoomModal()">＋ ${t('addRoom')}</button>`)+`<div class="roomgrid">${rooms.map(r=>`<div class="room ${r.status==='free'?'free':r.status==='busy'?'busy':'off'}"><div class="muted small">${t('roomNumber')}</div><div class="roomnum">${r.name}</div><div class="muted small">${r.type}</div><p>${statusPill(r.status==='free'?'confirmed':r.status==='busy'?'pending':'cancelled')}</p><select onchange="setRoomStatus(${r.id},this.value)"><option value="free" ${r.status==='free'?'selected':''}>${t('free')}</option><option value="busy" ${r.status==='busy'?'selected':''}>${t('busy')}</option><option value="maintenance" ${r.status==='maintenance'?'selected':''}>${t('maintenance')}</option></select></div>`).join('')}</div><section class="panel" style="margin-top:17px"><h2>${t('roomAssign')} · ${t('booking')}</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>${t('project')}</th><th>${t('therapist')}</th><th>${t('date')} / ${t('time')}</th><th>${t('room')}</th><th>Action</th></tr></thead><tbody>${bookings.filter(b=>b.status==='confirmed').map(b=>`<tr><td>#${b.id}</td><td>${serviceName(serviceById(b.service))}</td><td>${therapistName(therapistById(b.tid))}</td><td>${b.date} ${b.time}</td><td><select onchange="assignRoom(${b.id},this.value)">${rooms.map(r=>`<option value="${r.id}" ${r.id===b.room?'selected':''} ${r.status==='maintenance'?'disabled':''}>${r.name} (${t(r.status==='free'?'free':r.status==='busy'?'busy':'maintenance')})</option>`).join('')}</select></td><td><button class="secondary" onclick="autoAssign(${b.id})">${t('assign')}</button></td></tr>`).join('')}</tbody></table></div></section>`}
function commissionFor(b){const sv=serviceById(b.service),th=therapistById(b.tid);return Math.round((sv?.duration||0)/60*(sv?.rate??th?.rate??0))}
function monthBookings(){return bookings.filter(b=>b.date&&b.date.slice(0,7)===financeMonth)}
function renderFinance(){const month=monthBookings(),completed=month.filter(b=>b.status==='completed');const revenue=completed.reduce((a,b)=>a+(serviceById(b.service)?.cash||0),0);const expense=completed.reduce((a,b)=>a+commissionFor(b),0);const profit=revenue-expense;const monthRecharge=rechargeLog.filter(x=>x.date?.startsWith(financeMonth)).reduce((a,x)=>a+x.won,0);const remaining=members.reduce((a,m)=>a+m.balance,0);const commissions=completed.reduce((a,b)=>a+commissionFor(b),0);return head(t('finance'),'按服务实际完成月份核算；会员充值属于资金流水，不直接计入当月服务收入。')+`<div class="toolbar"><label for="financeMonth">选择月份</label><input id="financeMonth" type="month" value="${financeMonth}" onchange="financeMonth=this.value;render()"><span class="muted small">统计范围：${financeMonth}</span></div><div class="cards">${stat('当月服务收入',money(revenue),'仅统计已完成服务的实际服务金额')}${stat('当月技师费用',money(expense),'已完成服务对应的技师佣金')}${stat('当月经营利润',money(profit),'服务收入 − 技师费用')}${stat('当月充值到账',money(monthRecharge),'独立资金流水，不计入服务收入')}</div><div class="grid2"><section class="panel"><h2>当月经营核算</h2>${[['服务收入',revenue],['技师佣金费用',expense],['经营利润',profit]].map(([name,val])=>`<div class="barrow"><span>${name}</span><div class="bar"><span style="width:${Math.max(4,Math.min(100,Math.abs(val)/Math.max(revenue,1)*100))}%"></span></div><b>${money(val)}</b></div>`).join('')}<p class="footer-note">收入按完成服务的项目价格计算；佣金按该服务设置的每小时佣金率 × 服务时长计算。这里的“利润”暂指扣除技师佣金后的经营差额，尚未扣除房租、水电、税费、支付手续费等其他费用。</p></section><section class="panel"><h2>会员资金与余额（独立于利润）</h2><div class="person" style="margin:14px 0"><div style="flex:1">当月已审核充值到账</div><b>${money(monthRecharge)}</b></div><div class="person" style="margin:14px 0"><div style="flex:1">全体会员当前剩余会员币</div><b>${remaining} coins</b></div><div class="person" style="margin:14px 0"><div style="flex:1">本月完成服务数量</div><b>${completed.length}</b></div><p class="footer-note">会员币余额按币数展示。正式财务账务应另外保存充值现金、服务核销金额、退款和调整的不可覆盖流水。</p></section></div><section class="panel" style="margin-top:16px"><h2>技师佣金明细与批量支付</h2><div class="toolbar"><button class="secondary" onclick="selectCommissionStatus('pending')">选择全部待支付</button><button class="secondary" onclick="selectCommissionStatus('paid')">选择全部已支付</button><button onclick="generateCommissionStatement()">生成所选明细表</button><button class="secondary" onclick="markCommissionsPaid()">标记所选为已支付</button></div><div class="tablewrap"><table><thead><tr><th>选择</th><th>服务日期</th><th>预约编号</th><th>技师</th><th>服务</th><th>时长</th><th>佣金</th><th>支付状态</th><th>转账日期</th></tr></thead><tbody>${completed.map(b=>{const sv=serviceById(b.service),th=therapistById(b.tid),amount=commissionFor(b);return `<tr><td><input type="checkbox" style="width:auto" ${selectedCommissionBookings.includes(b.id)?'checked':''} onchange="toggleCommission(${b.id},this.checked)"></td><td>${b.date}</td><td>#${b.id}</td><td>${therapistName(th)}</td><td>${serviceName(sv)}</td><td>${sv?.duration||0} 分钟</td><td>${money(amount)}</td><td>${b.commissionStatus==='paid'?'<span class="pill">已支付</span>':'<span class="pill gold">待支付</span>'}</td><td>${b.commissionPaidDate||'—'}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">所选月份暂无已完成服务佣金</td></tr>'}</tbody></table></div><p class="footer-note">先勾选需要处理的服务记录，再生成明细表；实际银行转账完成后，再点击“标记所选为已支付”。本原型不会自动转账。</p></section><section class="panel" style="margin-top:16px"><h2>当月服务流水</h2><div class="tablewrap"><table><thead><tr><th>预约</th><th>会员</th><th>服务</th><th>技师</th><th>服务日期</th><th>会员币消耗</th><th>实际服务金额</th><th>状态</th></tr></thead><tbody>${month.map(b=>`<tr><td>#${b.id}</td><td>${memberName(b.member)}</td><td>${serviceName(serviceById(b.service))}</td><td>${therapistName(therapistById(b.tid))}</td><td>${b.date}</td><td>${b.status==='completed'?'-'+b.coins:'—'}</td><td>${b.status==='completed'?money(serviceById(b.service)?.cash||0):'—'}</td><td>${bookingStatusPill(b.status)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">该月暂无服务记录</td></tr>'}</tbody></table></div></section>`}
function toggleCommission(id,checked){selectedCommissionBookings=checked?[...new Set([...selectedCommissionBookings,id])]:selectedCommissionBookings.filter(x=>x!==id)}
function selectCommissionStatus(status){selectedCommissionBookings=monthBookings().filter(b=>b.status==='completed'&&(b.commissionStatus||'pending')===status).map(b=>b.id);render()}
function generateCommissionStatement(){const rows=monthBookings().filter(b=>b.status==='completed'&&selectedCommissionBookings.includes(b.id));if(!rows.length)return toast('请先选择已完成服务的佣金记录');const total=rows.reduce((a,b)=>a+commissionFor(b),0);const body=rows.map(b=>`<tr><td>#${b.id}</td><td>${b.date}</td><td>${therapistName(therapistById(b.tid))}</td><td>${serviceName(serviceById(b.service))}</td><td>${money(commissionFor(b))}</td><td>${b.commissionStatus==='paid'?'已支付':'待支付'}</td></tr>`).join('');openModal('技师佣金转账明细表',`<p>月份：${financeMonth} · 所选记录：${rows.length} 条 · 合计：<b>${money(total)}</b></p><div class="tablewrap"><table><thead><tr><th>预约</th><th>日期</th><th>技师</th><th>服务</th><th>佣金</th><th>状态</th></tr></thead><tbody>${body}</tbody></table></div><p class="footer-note">可使用浏览器打印功能另存为 PDF，作为线下转账核对清单。</p>`,()=>{closeModal();window.print()})}
function markCommissionsPaid(){const rows=monthBookings().filter(b=>b.status==='completed'&&selectedCommissionBookings.includes(b.id)&&b.commissionStatus!=='paid');if(!rows.length)return toast('请先选择待支付记录');const date=new Date().toISOString().slice(0,10);rows.forEach(b=>{b.commissionStatus='paid';b.commissionPaidDate=date;b.commissionPaidBy='老板'});selectedCommissionBookings=selectedCommissionBookings.filter(id=>!rows.some(b=>b.id===id));render();toast(`已将 ${rows.length} 条佣金记录标记为已支付（请确保现实转账已完成）`)}
function renderSettings(){return head(t('settings'),t('languageSettings'))+`<div class="grid2"><section class="panel"><h2>${t('languageSettings')}</h2><div class="field"><label>${t('sourceLanguage')}</label><select disabled><option>한국어 (ko)</option></select></div><div class="field"><label>${t('autoTranslation')}</label><select><option>한국어 → 中文 / English</option></select></div><p class="muted">${t('translationNote')}</p><button class="secondary" onclick="toast(t('translationNote'))">${t('translate')}</button></section><section class="panel"><h2>Prototype / System</h2><p class="muted">${t('prototypeNote')}</p><p>• ${t('overview')} · ${t('booking')} · ${t('services')} · ${t('members')}</p><p>• ${t('therapists')} · ${t('schedule')} · ${t('rooms')} · ${t('finance')}</p><button class="secondary" onclick="resetDemo()">Reset demo data</button></section></div>`}
function renderTherapistLogin(){return head('技师登录','每位技师使用自己的 ID 登录，只能查看自己的预约、佣金、技能和排班。')+`<section class="panel" style="max-width:520px;margin:0 auto"><h2>技师账号登录</h2><div class="field"><label>技师 ID</label><select id="therapistLoginId">${therapists.filter(x=>x.active).map(th=>`<option value="${th.id}">T${String(1000+th.id)} · ${therapistName(th)}</option>`).join('')}</select></div><div class="field"><label>密码</label><input id="therapistLoginPw" type="password" placeholder="演示密码 demo123"></div><button onclick="loginTherapist()">登录技师工作台</button><p class="footer-note">原型演示账号：T1001、T1002、T1003；密码均为 demo123。正式上线必须由服务器验证身份与权限。</p></section>`}
function loginTherapist(){let id=+$('therapistLoginId').value,pw=$('therapistLoginPw').value;if(pw!=='demo123'||!therapists.some(x=>x.id===id&&x.active))return toast('技师 ID 或密码错误');therapistSessionId=id;page='booking';render();toast('登录成功：'+therapistName(currentTherapist()))}

function renderUpcoming(){const th=currentTherapist(),today=new Date();today.setHours(0,0,0,0);const todayKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;const rows=bookings.filter(b=>b.tid===th.id&&b.date>=todayKey&&['pending','confirmed','in_progress'].includes(b.status)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return head('接下来的预约安排',`${therapistName(th)} · 只显示本人未来预约`,`<button class="secondary" onclick="logoutTherapist()">退出登录</button>`)+`<div class="cards">${stat('待确认',rows.filter(b=>b.status==='pending').length,'需要你或老板其中一方确认')}${stat('待进行',rows.filter(b=>b.status==='confirmed').length,'已确认并分配房间')}${stat('进行中',rows.filter(b=>b.status==='in_progress').length,'正在服务')}</div><section class="panel"><h2>我的未来预约</h2><div class="tablewrap"><table><thead><tr><th>日期 / 时间</th><th>会员</th><th>服务 / 时长</th><th>房间</th><th>状态</th><th>确认人</th><th>操作</th></tr></thead><tbody>${rows.map(b=>`<tr><td>${b.date}<br>${b.time}</td><td>${memberName(b.member)}</td><td>${serviceName(serviceById(b.service))}<small class="muted" style="display:block">${serviceById(b.service)?.duration||0} 分钟</small></td><td>${rooms.find(r=>r.id===b.room)?.name||'待选择'}</td><td>${bookingStatusPill(b.status)}</td><td>${b.confirmedBy||'—'}</td><td>${b.status==='pending'?`<button onclick="approveBooking(${b.id})">确认并选房</button>`:b.status==='confirmed'?`<button onclick="startBooking(${b.id})">开始服务</button>`:b.status==='in_progress'?`<button onclick="completeBooking(${b.id})">完成服务</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">目前没有未来预约</td></tr>'}</tbody></table></div></section>`}

function renderCustomerRecharge(){let m=members.find(x=>x.id===customerSessionMemberId),mine=rechargeRequests.filter(x=>x.member===m.id);return head('会员充值','先提交申请；老板核实到账并审核后，会员币才会增加。')+`<div class="grid2"><section class="panel"><h2>提交充值申请</h2><div class="field"><label>充值金额（韩元）</label><select id="rechargeWon" onchange="$('rechargeCoins').value=Number(this.value)/1000"><option value="50000">₩50,000</option><option value="100000" selected>₩100,000</option><option value="200000">₩200,000</option><option value="300000">₩300,000</option><option value="500000">₩500,000</option></select></div><div class="field"><label>预计获得会员币（演示：₩1,000 = 1 coin）</label><input id="rechargeCoins" type="number" value="100" min="1"></div><div class="field"><label>支付方式</label><select id="rechargeMethod"><option value="bank">韩国银行转账（老板人工确认）</option><option value="storecard">店内信用卡刷卡（老板人工确认）</option><option value="cash">店内现金（老板人工确认）</option><option value="wechat">微信支付（待接入，当前仅登记意向）</option><option value="alipay">支付宝（待接入，当前仅登记意向）</option><option value="koreacard">线上信用卡（待接入，当前仅登记意向）</option></select></div><div class="field"><label>转账人 / 交易参考号 / 备注</label><input id="rechargeRef" placeholder="例如转账人姓名、银行交易参考号"></div><div class="field"><label>补充说明（可选）</label><textarea id="rechargeNote" rows="2" placeholder="如果是在店内刷卡，请填写日期或小票号"></textarea></div><button onclick="submitRechargeRequest()">提交充值申请</button><p class="footer-note">本原型不收取真实款项，也不会自动验证转账、刷卡、微信或支付宝交易。请勿输入银行卡密码、完整卡号或其他敏感支付信息。</p></section><section class="panel"><h2>我的充值申请</h2>${mine.length?`<div class="tablewrap"><table><thead><tr><th>申请日期</th><th>金额</th><th>方式</th><th>状态</th><th>备注</th></tr></thead><tbody>${mine.map(x=>`<tr><td>${x.date}</td><td>${money(x.won)}<br>${x.coins} coins</td><td>${paymentMethodName(x.method)}</td><td>${statusPill(x.status)}</td><td>${x.note||x.reference||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">暂无充值申请</div>'}</section></div>`}

function renderCustomerBooking(){if(!customerSessionMemberId)return customerLogin();let m=members.find(x=>x.id===customerSessionMemberId);if(!m){customerSessionMemberId=null;return customerLogin()}if(customerTab==='profile')return customerTabs()+renderCustomerProfile();if(customerTab==='recharge')return customerTabs()+renderCustomerRecharge();if(customerTab==='records')return customerTabs()+renderCustomerRecords();return customerTabs()+renderCustomerBookingBooking()}

function submitRechargeRequest(){let m=members.find(x=>x.id===customerSessionMemberId),won=+$('rechargeWon').value,coins=+$('rechargeCoins').value,method=$('rechargeMethod').value,reference=$('rechargeRef').value.trim(),note=$('rechargeNote').value.trim();if(!m||won<=0||coins<=0)return toast('请填写有效的充值金额和会员币数量');let id=Math.max(0,...rechargeRequests.map(x=>x.id))+1;rechargeRequests.push({id,member:m.id,coins,won,method,reference,note,date:new Date().toISOString().slice(0,10),status:'pending'});customerTab='recharge';render();toast('申请已提交，等待老板审核')}

function closeModal(){$('modalRoot').innerHTML=''}
function openServiceModal(id){let s=services.find(x=>x.id===id)||{ko:'',zh:'',en:'',descKo:'',descZh:'',descEn:'',duration:60,coins:80,cash:60000,rate:18000,room:'일반 룸',active:true};openModal(id?t('edit')+' · '+t('services'):t('newService'),`<div class="field"><label>${t('serviceName')}</label><input id="fko" value="${s.ko}"></div><div class="field"><label>${t('description')}</label><textarea id="fdesc">${s.descKo}</textarea></div><div class="threefields"><div class="field"><label>${t('duration')}</label><input id="fdur" type="number" value="${s.duration}"></div><div class="field"><label>${t('coins')}</label><input id="fcoins" type="number" value="${s.coins}"></div><div class="field"><label>${t('cashPrice')}</label><input id="fcash" type="number" value="${s.cash}"></div></div><div class="twofields"><div class="field"><label>${t('commissionRate')}</label><input id="frate" type="number" value="${s.rate}"></div><div class="field"><label>${t('roomType')}</label><select id="froom"><option>일반 룸</option><option ${s.room==='특수 룸'?'selected':''}>특수 룸</option></select></div></div><p class="muted small">${t('translationNote')}</p>`,()=>{let ko=$('fko').value.trim();if(!ko)return toast(t('serviceName'));let tr=translateDemo(ko);let d=$('fdesc').value.trim();let td=translateDemo(d);let item={id:id||Math.max(0,...services.map(x=>x.id))+1,ko,zh:tr.zh,en:tr.en,descKo:d,descZh:td.zh,descEn:td.en,duration:+$('fdur').value,coins:+$('fcoins').value,cash:+$('fcash').value,rate:+$('frate').value,room:$('froom').value,active:s.active!==undefined?s.active:true};if(id)services=services.map(x=>x.id===id?item:x);else services.push(item);closeModal();render();toast(t('success'))})}
function translateDemo(ko){const map={'아로마 마사지':['精油按摩','Aromatherapy Massage'],'발 관리':['足部护理','Foot Care'],'핫스톤 마사지':['热石按摩','Hot Stone Massage'],'림프 마사지':['淋巴按摩','Lymphatic Massage'],'전신 마사지':['全身按摩','Full Body Massage'],'목·어깨 관리':['颈肩护理','Neck & Shoulder Care'],'아로마 오일을 사용한 전신 마사지입니다.':['使用芳香精油进行的全身按摩。','A full-body massage using aromatic oils.'],'발과 종아리를 집중 관리합니다.':['重点护理足部和小腿。','Focused care for feet and calves.'],'따뜻한 스톤을 활용한 릴랙싱 마사지입니다.':['使用温热石头的放松按摩。','A relaxing massage using warm stones.']};if(map[ko])return {zh:map[ko][0],en:map[ko][1]};return {zh:'[待校对] '+ko,en:'[Review translation] '+ko}}
function toggleService(id){services=services.map(s=>s.id===id?{...s,active:!s.active}:s);render();toast(t('success'))}
function openMemberModal(){openModal(t('addMember'),`<div class="field"><label>${t('memberName')}</label><input id="mname"></div><div class="field"><label>${t('phone')}</label><input id="mphone"></div><div class="field"><label>${t('balance')}</label><input id="mbal" type="number" value="0"></div>`,()=>{if(!$('mname').value.trim())return;members.push({id:Math.max(0,...members.map(m=>m.id))+1,name:$('mname').value.trim(),phone:$('mphone').value,balance:+$('mbal').value,recharged:+$('mbal').value,used:0,note:''});closeModal();render();toast(t('success'))})}
function rechargeMember(id){let m=members.find(x=>x.id===id);openModal(t('recharge')+' · '+m.name,`<div class="field"><label>Coins to add</label><input id="rcoins" type="number" value="100"></div><div class="field"><label>Payment amount (KRW)</label><input id="rwon" type="number" value="100000"></div>`,()=>{let c=+$('rcoins').value,w=+$('rwon').value;if(c<=0||w<0)return;m.balance+=c;m.recharged+=c;rechargeLog.push({id:Math.max(0,...rechargeLog.map(x=>x.id))+1,member:id,amount:c,won:w,date:new Date().toISOString().slice(0,10),method:'Owner manual adjustment',approvedBy:'Owner'});closeModal();render();toast(t('success'))})}
function openTherapistModal(id){let th=therapists.find(x=>x.id===id)||{name:'',latin:'',skills:[],rate:20000,active:true};openModal(id?t('edit')+' · '+t('therapists'):t('addTherapist'),`<div class="field"><label>${t('therapistName')} (한국어)</label><input id="thname" value="${th.name}"></div><div class="field"><label>English display name</label><input id="thlatin" value="${th.latin}"></div><div class="field"><label>${t('commissionRate')}</label><input id="thrate" type="number" value="${th.rate}"></div><label>${t('skills')}</label>${services.map(s=>`<label class="checkrow" style="margin:9px 0"><input type="checkbox" class="skillbox" value="${s.id}" ${th.skills.includes(s.id)?'checked':''}> ${serviceName(s)}</label>`).join('')}`,()=>{let name=$('thname').value.trim();if(!name)return;let skills=[...document.querySelectorAll('.skillbox:checked')].map(x=>+x.value);let item={id:id||Math.max(0,...therapists.map(x=>x.id))+1,name,latin:$('thlatin').value||name,rate:+$('thrate').value,skills,active:th.active!==undefined?th.active:true};if(id)therapists=therapists.map(x=>x.id===id?item:x);else therapists.push(item);closeModal();render();toast(t('success'))})}
function toggleTherapist(id){therapists=therapists.map(x=>x.id===id?{...x,active:!x.active}:x);render()}
function openShiftModal(){openModal(t('openTime'),`<div class="field"><label>${t('therapist')}</label><select id="shther" ${role==='therapist'?'disabled':''}>${(role==='therapist'?[currentTherapist()]:therapists.filter(x=>x.active)).map(th=>`<option value="${th.id}" ${role==='therapist'?'selected':''}>${therapistName(th)}</option>`).join('')}</select></div><div class="field"><label>${t('date')}</label><input id="shdate" type="date" value="2026-10-17"></div><div class="twofields"><div class="field"><label>${t('startTime')}</label><input id="shstart" type="time" value="10:00"></div><div class="field"><label>${t('endTime')}</label><input id="shend" type="time" value="19:00"></div></div>`,()=>{let start=$('shstart').value,end=$('shend').value;if(start>=end)return toast('End time must be after start time');shifts.push({tid:+$('shther').value,date:$('shdate').value,start,end,status:'open'});closeModal();render();toast(t('success'))})}
function openLeaveModal(){openModal(t('requestLeave'),`<div class="field"><label>${t('therapist')}</label><select id="lvther">${(role==='therapist'?[currentTherapist()]:therapists).map(th=>`<option value="${th.id}">${therapistName(th)}</option>`).join('')}</select></div><div class="field"><label>${t('leaveDate')}</label><input id="lvdate" type="date" value="2026-10-18"></div><div class="twofields"><div class="field"><label>${t('startTime')}</label><input id="lvstart" type="time" value="10:00"></div><div class="field"><label>${t('endTime')}</label><input id="lvend" type="time" value="19:00"></div></div><div class="field"><label>Reason</label><input id="lvreason" placeholder="Optional"></div><p class="muted small">Prototype rule: no booking conflict → auto-approved; existing booking → pending owner review.</p>`,()=>{let tid=+$('lvther').value,date=$('lvdate').value,start=$('lvstart').value,end=$('lvend').value;let conflict=bookings.some(b=>b.tid===tid&&b.date===date&&b.status==='confirmed');let id=Math.max(0,...leaveRequests.map(x=>x.id))+1;leaveRequests.push({id,tid,date,start,end,reason:$('lvreason').value,status:conflict?'pending':'approved'});if(!conflict)shifts=shifts.filter(s=>!(s.tid===tid&&s.date===date));closeModal();render();toast(conflict?'Leave submitted for owner review':t('success'))})}
function decideLeave(id,approve){let l=leaveRequests.find(x=>x.id===id);if(!l)return;l.status=approve?'approved':'rejected';if(approve)shifts=shifts.filter(s=>!(s.tid===l.tid&&s.date===l.date));render();toast(t('success'))}
function removeShift(tid,date){if(bookings.some(b=>b.tid===tid&&b.date===date&&b.status==='confirmed'))return toast('Existing booking conflict: reschedule first');shifts=shifts.filter(s=>!(s.tid===tid&&s.date===date));render()}
function openRoomModal(){openModal(t('addRoom'),`<div class="field"><label>${t('roomNumber')}</label><input id="rname" placeholder="Room 05"></div><div class="field"><label>${t('roomType')}</label><select id="rtype"><option>일반 룸</option><option>특수 룸</option></select></div>`,()=>{if(!$('rname').value.trim())return;rooms.push({id:Math.max(0,...rooms.map(r=>r.id))+1,name:$('rname').value.trim(),type:$('rtype').value,status:'free'});closeModal();render();toast(t('success'))})}
function setRoomStatus(id,v){let r=rooms.find(x=>x.id===id);if(v==='maintenance'&&bookings.some(b=>b.room===id&&b.status==='confirmed')){toast('Room has active bookings');render();return}r.status=v;render()}
function assignRoom(bid,rid){let b=bookings.find(x=>x.id===bid),room=rooms.find(x=>x.id===+rid);if(!b||!room)return;if(room.status==='maintenance'){toast('Room is unavailable');render();return}b.room=+rid;toast(t('success'))}
function autoAssign(bid){let b=bookings.find(x=>x.id===bid),s=serviceById(b.service);let room=rooms.find(r=>r.type===s.room&&r.status!=='maintenance'&&!bookings.some(o=>o.id!==bid&&o.room===r.id&&o.date===b.date&&o.time===b.time&&o.status==='confirmed'));if(!room)return toast('No compatible room available');b.room=room.id;render();toast(t('success'))}
function openBookingModal(){openModal(t('newBooking'),`<div class="field"><label>${t('member')}</label><select id="bm">${members.map(m=>`<option value="${m.id}">${m.name} · ${m.balance} coins</option>`).join('')}</select></div><div class="field"><label>${t('project')}</label><select id="bs" onchange="updateBookingTherapists()">${services.filter(s=>s.active).map(s=>`<option value="${s.id}">${serviceName(s)} · ${s.coins} coins</option>`).join('')}</select></div><div class="field"><label>${t('therapist')}</label><select id="bt">${therapists.filter(th=>th.active).map(th=>`<option value="${th.id}">${therapistName(th)}</option>`).join('')}</select></div><div class="twofields"><div class="field"><label>${t('date')}</label><input id="bd" type="date" value="2026-10-17"></div><div class="field"><label>${t('time')}</label><input id="btime" type="time" value="10:00"></div></div><div class="field"><label>${t('room')}</label><select id="br">${rooms.filter(r=>r.status!=='maintenance').map(r=>`<option value="${r.id}">${r.name} · ${r.type}</option>`).join('')}</select></div>`,()=>{let mid=+$('bm').value,sid=+$('bs').value,tid=+$('bt').value,date=$('bd').value,time=$('btime').value,room=+$('br').value,s=serviceById(sid),m=members.find(x=>x.id===mid),th=therapistById(tid);if(!th.skills.includes(sid))return toast('Therapist is not authorized for this service');if(m.balance<s.coins)return toast('Insufficient membership coins');if(bookings.some(b=>b.date===date&&b.time===time&&b.status==='confirmed'&&(b.tid===tid||b.room===room)))return toast('Therapist or room conflict');let id=Math.max(1000,...bookings.map(b=>b.id))+1;bookings.push({id,member:mid,service:sid,tid,date,time,room,status:'pending',coins:s.coins});closeModal();render();toast(t('bookingDone'))})}
function updateBookingTherapists(){let sid=+$('bs').value;$('bt').innerHTML=therapists.filter(th=>th.active&&th.skills.includes(sid)).map(th=>`<option value="${th.id}">${therapistName(th)}</option>`).join('')}
function approveBooking(id){let b=bookings.find(x=>x.id===id);if(!b||b.status!=='pending')return;if(role==='therapist'&&b.tid!==therapistSessionId)return toast('只能确认分配给自己的预约');let s=serviceById(b.service);const candidates=rooms.filter(r=>r.type===s.room&&r.status!=='maintenance');if(!candidates.length)return toast('没有符合服务要求的可用房间');openModal('确认预约 · 选择房间',`<p>预约 #${b.id} · ${serviceName(s)} · ${b.date} ${b.time} · ${s.duration} 分钟</p><div class="field"><label>选择服务房间</label><select id="approveRoom">${candidates.map(r=>`<option value="${r.id}" ${r.id===b.room?'selected':''}>${r.name} · ${r.type}</option>`).join('')}</select></div><p class="footer-note">老板或该预约所属技师任一方确认即可。选择房间并保存后，预约才正式确认。</p>`,()=>{let roomId=+$('approveRoom').value,m=members.find(x=>x.id===b.member);const reserved=bookings.filter(o=>o.id!==id&&o.member===b.member&&['confirmed','in_progress'].includes(o.status)).reduce((sum,o)=>sum+(o.coins||serviceById(o.service)?.coins||0),0);if(!m||m.balance-reserved<s.coins)return toast('会员可用余额不足（已考虑其他已确认预约）');if(bookings.some(o=>o.id!==id&&['confirmed','in_progress'].includes(o.status)&&o.date===b.date&&(o.tid===b.tid||o.room===roomId)&&overlap(b.time,s.duration,o.time,serviceById(o.service).duration)))return toast('技师或房间时间冲突，请选择其他房间/时段');b.room=roomId;b.status='confirmed';b.confirmedBy=role==='therapist'?`${currentTherapist().name}（技师）`:'老板';b.commissionStatus=b.commissionStatus||'pending';closeModal();render();toast('预约已确认；会员币将在服务完成后扣除');openGoogleCalendar(id)})}
function rejectBooking(id){let b=bookings.find(x=>x.id===id);if(!b||b.status!=='pending')return;b.status='cancelled';render();toast(t('rejectBooking'))}
function openGoogleCalendar(id){let b=bookings.find(x=>x.id===id);if(!b||b.status!=='confirmed')return;let s=serviceById(b.service),th=therapistById(b.tid),r=rooms.find(x=>x.id===b.room);let start=new Date(`${b.date}T${b.time}:00+09:00`);let end=new Date(start.getTime()+(s?.duration||60)*60000);let stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');let title=encodeURIComponent(`${serviceName(s)} · ${memberName(b.member)} · ${therapistName(th)}`);let details=encodeURIComponent(`Booking #${b.id}\nMember: ${memberName(b.member)}\nTherapist: ${therapistName(th)}\nRoom: ${r?.name||'TBD'}\nMembership coins: ${b.coins}`);let url=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${stamp(start)}/${stamp(end)}&details=${details}&location=${encodeURIComponent(r?.name||'SPA Studio')}&ctz=Asia%2FSeoul`;window.open(url,'_blank','noopener');}
function startBooking(id){let b=bookings.find(x=>x.id===id);if(!b||b.status!=='confirmed')return;b.status='in_progress';b.startedAt=new Date().toISOString();render();toast('服务已标记为进行中')}
function completeBooking(id){let b=bookings.find(x=>x.id===id);if(!b||!['confirmed','in_progress'].includes(b.status))return;let m=members.find(x=>x.id===b.member),s=serviceById(b.service);const otherReserved=bookings.filter(o=>o.id!==id&&o.member===b.member&&['confirmed','in_progress'].includes(o.status)).reduce((sum,o)=>sum+(o.coins||serviceById(o.service)?.coins||0),0);if(!m||m.balance<s.coins+otherReserved)return toast('会员余额不足以完成扣款，请先核对会员账户');b.status='completed';b.completedAt=new Date().toISOString();b.commissionStatus=b.commissionStatus||'pending';m.balance-=s.coins;m.used+=s.coins;usageLog.push({id:Math.max(0,...usageLog.map(x=>x.id))+1,member:m.id,booking:b.id,coins:s.coins,date:new Date().toISOString().slice(0,10),description:'实际完成服务扣除会员币'});let r=rooms.find(x=>x.id===b.room);if(r&&r.status==='busy')r.status='free';render();toast('服务已完成，会员币已扣除，并计入本月收入与技师佣金')}
function filterBookings(v){let list=bookings.filter(b=>role!=='therapist'||b.tid===therapistSessionId).filter(b=>[memberName(b.member),serviceName(serviceById(b.service)),therapistName(therapistById(b.tid)),b.date].join(' ').toLowerCase().includes(v.toLowerCase()));$('bookingRows').innerHTML=bookingRows(list)}
function filterBookingStatus(v){let list=bookings.filter(b=>(role!=='therapist'||b.tid===therapistSessionId)&&(v==='all'||b.status===v));$('bookingRows').innerHTML=bookingRows(list)}
function findAvailability(){selectedDate=$('bookingDate').value;let range=$('timeRange').value,s=serviceById(selectedService),tid=bookingMode==='therapist'?+$('bookingTherapist').value:null;let times=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00'];foundSlots=[];for(let th of therapists.filter(x=>x.active&&x.skills.includes(selectedService)&&(!tid||x.id===tid))){let shift=shifts.find(x=>x.tid===th.id&&x.date===selectedDate&&x.status==='open');if(!shift)continue;for(let time of times){if(time<shift.start||time>=shift.end)continue;if(range==='morning'&&time>='12:00'||range==='afternoon'&&(time<'12:00'||time>='17:00')||range==='evening'&&time<'17:00')continue;let start=+time.slice(0,2)*60,finish=start+s.duration;if(finish>+shift.end.slice(0,2)*60+ +shift.end.slice(3))continue;let busy=bookings.some(b=>b.tid===th.id&&b.date===selectedDate&&['pending','confirmed','in_progress'].includes(b.status)&&overlap(time,s.duration,b.time,serviceById(b.service).duration));if(busy)continue;let room=rooms.find(r=>r.type===s.room&&r.status!=='maintenance'&&!bookings.some(b=>b.room===r.id&&b.date===selectedDate&&['pending','confirmed','in_progress'].includes(b.status)&&overlap(time,s.duration,b.time,serviceById(b.service).duration)));if(!room)continue;foundSlots.push({key:th.id+'-'+time,tid:th.id,time,room:room.id})}}foundSlots.sort((a,b)=>a.time.localeCompare(b.time));selectedSlot='';render()}
function overlap(a,ad,b,bd){let am=+a.slice(0,2)*60+ +a.slice(3),bm=+b.slice(0,2)*60+ +b.slice(3);return am<bm+bd&&bm<am+ad}
function confirmCustomerBooking(){let sl=foundSlots.find(x=>x.key===selectedSlot);if(!sl)return toast(t('noSlots'));let mid=customerSessionMemberId,m=members.find(x=>x.id===mid),s=serviceById(selectedService);if(m.balance<s.coins)return toast('Insufficient membership coins');if(bookings.some(b=>b.tid===sl.tid&&b.date===selectedDate&&b.status==='confirmed'&&overlap(sl.time,s.duration,b.time,serviceById(b.service).duration)))return toast('Slot just became unavailable');bookings.push({id:Math.max(1000,...bookings.map(b=>b.id))+1,member:mid,service:selectedService,tid:sl.tid,date:selectedDate,time:sl.time,room:sl.room,status:'pending',coins:s.coins});foundSlots=[];selectedSlot='';render();toast(t('bookingDone'))}
function resetDemo(){if(!confirm('Reset all prototype changes?'))return;location.reload()}
$('language').addEventListener('change',e=>{lang=e.target.value;render()});
$('roleSelect').addEventListener('change',e=>{role=e.target.value;if(role==='therapist')therapistSessionId=null;if(role==='customer'){customerSessionMemberId=null;customerTab='profile'}page=role==='customer'?'booking':role==='therapist'?'schedule':'overview';render()});
render();
</script>
</body>
